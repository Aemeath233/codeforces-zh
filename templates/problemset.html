{% extends 'base.html' %}

{% block title %}题库 · CF 中文练习助手{% endblock %}

{% block content %}
<div>
    <!-- Page Header -->
    <div class="page-header library-heading">
        <div>
            <h1 class="page-title">题库</h1>
            <p class="page-subtitle">按名称、难度或标签，找一道想做的题。</p>
        </div>
        <button
            class="btn-secondary"
            id="sync-lib-btn"
            onclick="syncLibrary()"
            style="display: flex; align-items: center; gap: 8px; padding: 10px 16px;"
        >
            <i data-lucide="refresh-cw" id="sync-icon" style="width: 16px; height: 16px;"></i>
            <span id="sync-btn-text">更新题库</span>
        </button>
    </div>

    <!-- Modern Filter Dashboard Panel -->
    <div class="search-container">
        <form id="filter-form" onsubmit="handleSearchSubmit(event)" style="display: flex; flex-direction: column; gap: 16px;">
            <div class="search-row library-filters">
                <!-- Keyword search -->
                <div class="filter-field keyword-field">
                    <label for="searchQuery">搜索题目</label>
                    <div class="search-input-wrapper">
                    <i data-lucide="search" class="search-icon" style="width: 20px; height: 20px;"></i>
                    <input
                        type="text"
                        id="searchQuery"
                        class="search-input"
                        placeholder="题目名称、题号（如 4A）或 CF 题目链接"
                    />
                    </div>
                </div>

                <!-- Rating Boundaries -->
                <div class="filter-field">
                    <label for="minRating">最低难度</label>
                    <input
                        type="number"
                        id="minRating"
                        class="form-input"
                        style="padding: 12.5px 12px; min-width: 80px;"
                        placeholder="不限"
                        min="0" step="1"
                    />
                </div>
                <div class="filter-field">
                    <label for="maxRating">最高难度</label>
                    <input
                        type="number"
                        id="maxRating"
                        class="form-input"
                        style="padding: 12.5px 12px; min-width: 80px;"
                        placeholder="不限"
                        min="0" step="1"
                    />
                </div>

                <button type="submit" class="search-button">
                    筛选
                </button>
            </div>

            <!-- Tags list filters -->
            <div style="display: flex; flex-direction: column; gap: 8px;">
                <span style="font-size: 13px; font-weight: 600; color: var(--text-secondary); display: flex; align-items: center; gap: 4px;">
                    <i data-lucide="hash" style="width: 14px; height: 14px;"></i> 算法标签
                </span>
                <div id="tags-container" style="display: flex; gap: 8px; flex-wrap: wrap; max-height: 72px; overflow-y: auto; padding-right: 4px;">
                    <!-- Tags populated dynamically via JS -->
                </div>
            </div>

            <!-- Clear button -->
            <button
                type="button"
                id="clear-filters-btn"
                class="btn-secondary"
                onclick="handleClearFilters()"
                style="display: none; width: fit-content; padding: 6px 12px; font-size: 12px; align-self: flex-end;"
            >
                清空筛选条件
            </button>
        </form>
    </div>

    <!-- Grid Library List -->
    <div class="library-panel">

        <!-- Batch Control Panel -->
        <div id="batch-control-panel" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background-color: var(--bg-hover); border: 1px solid var(--border-color); border-radius: 10px; flex-wrap: wrap; gap: 12px; margin-bottom: 4px;">
            <div style="font-size: 14px; color: var(--text-secondary); display: flex; align-items: center; gap: 8px;">
                <i data-lucide="info" style="width: 16px; height: 16px; color: var(--primary);"></i>
                <span>已选中 <strong style="color: var(--primary);" id="selected-count">0</strong> 道题目</span>
            </div>
            <div style="display: flex; gap: 12px; align-items: center;">
                <button onclick="clearSelection()" class="btn-secondary" style="padding: 6px 14px; font-size: 13px; font-weight: 600;">
                    取消选择
                </button>
                <button onclick="startBatchTranslation()" class="search-button" style="padding: 6px 16px; font-size: 13px; font-weight: bold; display: flex; align-items: center; gap: 8px;" id="batch-submit-btn">
                    <i data-lucide="zap" style="width: 14px; height: 14px;"></i>
                    <span>批量翻译</span>
                </button>
            </div>
        </div>

        <!-- Table representation -->
        <div style="overflow-x: auto;">
            <table style="width: 100%; border-collapse: collapse; text-align: left; min-width: 700px;">
                <thead>
                    <tr style="border-bottom: 2px solid var(--border-color); color: var(--text-secondary); font-size: 13px; font-weight: 600;">
                        <th style="padding: 12px 16px; width: 40px;">
                            <input
                                type="checkbox"
                                id="select-all-checkbox"
                                onclick="toggleSelectAll(this)"
                                style="cursor: pointer; transform: scale(1.15);"
                                title="选择本页所有题目"
                            />
                        </th>
                        <th style="padding: 12px 16px; width: 150px;">题号</th>
                        <th style="padding: 12px 16px; width: 35%;">题目名称</th>
                        <th id="rating-column" aria-sort="none" style="padding: 12px 16px; width: 130px;">
                            <button type="button" class="sort-button" onclick="handleSortByRating()">
                                <span>难度</span>
                                <span id="sort-indicator" style="opacity: 0.3;">⇅</span>
                            </button>
                        </th>
                        <th style="padding: 12px 16px; width: 130px;">通过人数</th>
                        <th style="padding: 12px 16px;">标签</th>
                    </tr>
                </thead>
                <tbody id="problems-table-body">
                    <!-- Loaded via JS -->
                </tbody>
            </table>
        </div>

        <!-- Elegant Pagination Controls -->
        <div id="library-pagination" style="display: none; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; border-top: 1px solid var(--border-color); padding-top: 16px; margin-top: 8px;">
            <!-- Left side: statistics and limit select -->
            <div style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap;">
                <span style="font-size: 13.5px; color: var(--text-secondary);" id="pagination-stats">
                    显示 <b>0 - 0</b> 条 ，共计 <b>0</b> 道题
                </span>

                <div style="display: flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--text-secondary);">
                    <span>每页显示:</span>
                    <select
                        id="limit-select" aria-label="每页题目数量"
                        onchange="handleLimitChange(this.value)"
                        style="padding: 4px 8px; font-size: 13.5px; font-weight: 600; border: 1px solid var(--border-color); border-radius: var(--radius-sm); background-color: var(--bg-sidebar); color: var(--text-primary); outline: none; cursor: pointer;"
                    >
                        <option value="10">10 条</option>
                        <option value="20">20 条</option>
                        <option value="50">50 条</option>
                        <option value="100">100 条</option>
                    </select>
                </div>
            </div>

            <!-- Right side: smart buttons and page jump input -->
            <div style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap;">
                <div style="display: flex; align-items: center; gap: 6px;" id="pages-buttons-container">
                    <!-- Page numbers populated via JS -->
                </div>

                <!-- Page Jump Form -->
                <form onsubmit="handleJumpPage(event)" style="display: flex; align-items: center; gap: 6px;">
                    <input
                        type="number"
                        id="jump-page-input" aria-label="跳转页码"
                        placeholder="页码..."
                        style="width: 64px; padding: 6px 8px; font-size: 13px; text-align: center; border: 1px solid var(--border-color); border-radius: var(--radius-sm); background-color: var(--bg-sidebar); color: var(--text-primary); outline: none;"
                    />
                    <button
                        type="submit"
                        style="padding: 6px 12px; font-size: 13px; font-weight: 600; border-radius: var(--radius-sm); border: 1px solid var(--border-color); background-color: var(--bg-main); color: var(--text-secondary); cursor: pointer; transition: all var(--transition-fast);"
                    >
                        跳转
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block head %}
<style>
    .contest-card-row:hover {
        background-color: var(--primary-light) !important;
    }
</style>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/problemset.js') }}"></script>
{% endblock %}
